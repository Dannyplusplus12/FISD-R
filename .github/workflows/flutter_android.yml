name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'frontend-desktop/**'
      - 'packages/shared/**'
      - '.github/workflows/flutter_android.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          cd frontend-desktop
          flutter pub get

      - name: Build APK (release, unsigned)
        run: |
          cd frontend-desktop
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fisd-android-apk-${{ github.sha }}
          path: frontend-desktop/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error
