name: fisd
description: "FISD - Hệ thống quản lý kho hàng"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management — Riverpod wraps all async data and UI state.
  # Every feature has a provider; pages just read and watch those providers.
  flutter_riverpod: ^2.6.1

  # HTTP client — Dio gives us timeout, JSON auto-decode, and easy error handling.
  dio: ^5.7.0

  # Persist login session (employee id / role) across app restarts.
  shared_preferences: ^2.3.3

  # Date / number formatting in Vietnamese locale.
  intl: ^0.20.2

  # Delivery photo picker (mobile + desktop).
  image_picker: ^1.1.2

  cupertino_icons: ^1.0.8

  # Line/bar charts for the analytics page.
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
