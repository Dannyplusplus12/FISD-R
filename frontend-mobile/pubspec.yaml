name: fisd_mobile
description: "FISD Mobile - Ứng dụng PWA cho nhân viên (iPhone)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  fisd_shared:
    path: ../packages/shared

  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  shared_preferences: ^2.3.3
  intl: ^0.20.2
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8
  speech_to_text: ^7.0.0

  # Chat realtime + call/screen-share
  web_socket_channel: ^3.0.1
  flutter_webrtc: ^0.11.7
  permission_handler: ^11.3.1
  file_picker: ^8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
